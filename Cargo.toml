[package]
name = "ffxiv-gear-parser"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A Rust implementation of FFXIV gearset share string parser"
license = "MIT"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[[bin]]
name = "ffxiv-gear-parser"
path = "src/main.rs"

[lib]
name = "ffxiv_gear_parser"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]